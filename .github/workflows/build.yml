name: Build KirpichVisuals

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KirpichVisuals-1.1.0-Minecraft-1.21.4
          path: build/libs/*.jar
